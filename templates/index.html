<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BIST Hisse Avcısı V5</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f172a;
    color: #e5e7eb;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 20px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 18px;
    margin-right: 8px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

button:disabled {
    opacity: 0.5;
}

.status {
    margin: 18px 0;
    padding: 13px;
    background: #1e293b;
    border-radius: 10px;
}

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(290px, 1fr));
    gap: 15px;
}

.card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 17px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.symbol {
    font-size: 24px;
    font-weight: bold;
}

.price {
    font-size: 21px;
    font-weight: bold;
}

.signal {
    margin: 15px 0;
    padding: 10px;
    background: #0f172a;
    border-radius: 9px;
    font-size: 18px;
    font-weight: bold;
}

.metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.metric {
    background: #0f172a;
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
    color: #94a3b8;
}

.metric b {
    display: block;
    color: #e5e7eb;
    font-size: 15px;
    margin-top: 4px;
}

.why {
    margin-top: 14px;
    color: #94a3b8;
    font-size: 13px;
    line-height: 1.7;
}

.history {
    margin-top: 25px;
    background: #1e293b;
    padding: 15px;
    border-radius: 12px;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 9px;
    text-align: left;
    border-bottom: 1px solid #334155;
    font-size: 13px;
}

.error {
    color: #f87171;
    margin-top: 15px;
}

</style>

</head>

<body>

<div class="container">

<h1>📈 BIST Hisse Avcısı</h1>

<div class="subtitle">
Günlük fiyat + hacim + trend + RSI radar sistemi
</div>

<button
    id="scanButton"
    onclick="tara()">
    🔎 Hisseleri Tara
</button>

<button
    onclick="gecmisiGoster()">
    📜 Sinyal Geçmişi
</button>

<div
    id="status"
    class="status">

    Hazır. Tarama başlatmak için
    butona bas.

</div>

<div
    id="results"
    class="grid">
</div>

<div
    id="errors"
    class="error">
</div>

<div
    id="history"
    class="history"
    style="display:none;">

</div>

</div>


<script>


async function tara() {

    const button =
        document.getElementById(
            "scanButton"
        );

    const status =
        document.getElementById(
            "status"
        );

    const results =
        document.getElementById(
            "results"
        );

    const errors =
        document.getElementById(
            "errors"
        );


    button.disabled = true;

    status.innerText =
        "⏳ Hisseler taranıyor...";

    results.innerHTML =
        "<div>Veriler alınıyor. " +
        "Lütfen bekleyin...</div>";

    errors.innerHTML = "";


    try {

        const response =
            await fetch(
                "/api/scan"
            );


        if (!response.ok) {

            throw new Error(
                "Sunucu hatası: " +
                response.status
            );

        }


        const data =
            await response.json();


        status.innerText =
            "✅ Tarama tamamlandı — " +
            data.sonuc_sayisi +
            " hisse bulundu.";


        if (
            !data.sonuclar ||
            data.sonuclar.length === 0
        ) {

            results.innerHTML =
                "<div>" +
                "⚠️ Veri bulunamadı." +
                "</div>";

            return;

        }


        results.innerHTML =
            data.sonuclar
            .map(
                function(stock) {

                    const degisim =
                        Number(
                            stock.gunluk_degisim
                        );


                    let renk = "";

                    if (
                        stock.sinyal
                        .includes("AL")
                    ) {

                        renk =
                            "🟢";

                    }

                    if (
                        stock.sinyal
                        .includes("TAKİBE")
                    ) {

                        renk =
                            "👀";

                    }

                    if (
                        stock.sinyal
                        .includes("BEKLE")
                    ) {

                        renk =
                            "⏳";

                    }

                    if (
                        stock.sinyal
                        .includes("UZAK")
                    ) {

                        renk =
                            "🔴";

                    }

                    if (
                        stock.sinyal
                        .includes("AŞIRI")
                    ) {

                        renk =
                            "⚠️";

                    }


                    return `

                    <div class="card">

                        <div class="top">

                            <div
                                class="symbol">

                                ${stock.hisse}

                            </div>

                            <div
                                class="price">

                                ${Number(
                                    stock.fiyat
                                ).toFixed(2)}
                                ₺

                            </div>

                        </div>
