<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BIST Hisse Avcısı V9</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b1120;
            color: #e5e7eb;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 15px;
        }

        h1 {
            margin: 5px 0;
            font-size: 26px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .panel {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 12px;
            color: #93c5fd;
            font-size: 14px;
        }

        .progress-box {
            margin-top: 12px;
            width: 100%;
            height: 18px;
            background: #1f2937;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #22c55e;
            transition: width 0.3s;
        }

        .progress-text {
            margin-top: 6px;
            font-size: 13px;
            color: #94a3b8;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .filter {
            background: #1f2937;
            color: #cbd5e1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            cursor: pointer;
            font-size: 13px;
        }

        .filter.active {
            background: #2563eb;
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(290px, 1fr)
            );
            gap: 12px;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #475569;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .symbol {
            font-size: 21px;
            font-weight: bold;
            color: white;
        }

        .price {
            font-size: 19px;
            font-weight: bold;
        }

        .signal {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 9px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: bold;
            background: #1f2937;
        }

        .strong {
            background: #14532d;
            color: #bbf7d0;
        }

        .buy {
            background: #166534;
            color: #dcfce7;
        }

        .watch {
            background: #713f12;
            color: #fef3c7;
        }

        .squeeze {
            background: #312e81;
            color: #ddd6fe;
        }

        .danger {
            background: #7f1d1d;
            color: #fecaca;
        }

        .wait {
            background: #374151;
            color: #d1d5db;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .stat {
            background: #0f172a;
            padding: 8px;
            border-radius: 7px;
        }

        .stat-title {
            color: #64748b;
            font-size: 11px;
        }

        .stat-value {
            margin-top: 3px;
            font-size: 14px;
            font-weight: bold;
        }

        .positive {
            color: #4ade80;
        }

        .negative {
            color: #f87171;
        }

        .squeeze-score {
            margin-top: 10px;
            padding: 9px;
            border-radius: 8px;
            background: #172554;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .detail {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 1000;
            padding: 15px;
            overflow-y: auto;
        }

        .detail-box {
            max-width: 800px;
            margin: 20px auto;
            background: #111827;
            border-radius: 14px;
            padding: 18px;
            border: 1px solid #374151;
        }

        .close {
            float: right;
            background: #374151;
            padding: 7px 11px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(130px, 1fr)
            );
            gap: 8px;
            margin-top: 15px;
        }

        .detail-item {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
        }

        .detail-label {
            font-size: 11px;
            color: #64748b;
        }

        .detail-value {
            font-size: 15px;
            font-weight: bold;
            margin-top: 4px;
        }

        ul {
            padding-left: 20px;
            color: #cbd5e1;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 30px;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 22px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 10px;
            }

            .card {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📈 BIST Hisse Avcısı V9</h1>

    <div class="subtitle">
        Sıkışma + Patlama + Teknik Analiz
    </div>

    <div class="panel">

        <button
            id="scanButton"
            onclick="baslat()"
        >
            🚀 BIST'İ TARA
        </button>

        <div
            id="status"
            class="status"
        >
            Sistem hazır.
        </div>

        <div class="progress-box">

            <div
                id="progress"
                class="progress"
            ></div>

        </div>

        <div
            id="progressText"
            class="progress-text"
        >
            0 / 0
        </div>

    </div>


    <div class="filters">

        <div
            class="filter active"
            onclick="filtrele('TUM', this)"
        >
            TÜMÜ
        </div>

        <div
            class="filter"
            onclick="filtrele('GUCLU', this)"
        >
            🔥 GÜÇLÜ AL
        </div>

        <div
            class="filter"
            onclick="filtrele('AL', this)"
        >
            🟢 AL
        </div>

        <div
            class="filter"
            onclick="filtrele('SIKISMA', this)"
        >
            🔒 SIKIŞMA
        </div>

        <div
            class="filter"
            onclick="filtrele('TAKIP', this)"
        >
            👀 TAKİBE AL
        </div>

    </div>


    <div
        id="results"
        class="grid"
    >

        <div class="empty">
            Henüz tarama yapılmadı.
        </div>

    </div>

</div>


<!-- ======================================================
     DETAY PENCERESİ
======================================================= -->

<div
    id="detail"
    class="detail"
>

    <div class="detail-box">

        <button
            class="close"
            onclick="kapat()"
        >
            ✕
        </button>

        <div id="detailContent"></div>

    </div>

</div>


<script>

let sonuclar = [];

let aktifFiltre = "TUM";

let timer = null;


// ========================================================
// TARAMA BAŞLAT
// ========================================================

async function baslat() {

    const button =
        document.getElementById(
            "scanButton"
        );

    button.disabled = true;

    document.getElementById(
        "status"
    ).innerText =
        "Tarama başlatılıyor...";

    try {

        const response =
            await fetch(
                "/api/scan"
            );

        const data =
            await response.json();

        if (!data.basarili) {

            throw new Error(
                data.hata ||
                "Tarama başlatılamadı"
            );

        }

        takipEt();

    }

    catch (error) {

        document.getElementById(
            "status"
        ).innerText =
            "❌ " +
            error.message;

        button.disabled = false;

    }

}


// ========================================================
// DURUM TAKİBİ
// ========================================================

function takipEt() {

    if (timer) {

        clearInterval(timer);

    }

    kontrolEt();

    timer =
        setInterval(
            kontrolEt,
            2000
        );

}


// ========================================================
// DURUMU KONTROL ET
// ========================================================

async function kontrolEt() {

    try {

        const response =
            await fetch(
                "/api/status"
            );

        const data =
            await response.json();

        const progress =
            data.progress || 0;

        const total =
            data.total || 0;

        let yuzde = 0;

        if (total > 0) {

            yuzde =
                (
                    progress /
                    total
                ) * 100;

        }

        document.getElementById(
            "progress"
        ).style.width =
            yuzde + "%";

        document.getElementById(
            "progressText"
        ).innerText =
            progress +
            " / " +
            total;

        document.getElementById(
            "status"
        ).innerText =
            data.message ||
            "Tarama devam ediyor...";


        // Canlı sonuçları göster

        if (
            data.results &&
            data.results.length
        ) {

            sonuclar =
                data.results;

            goster();

        }


        // Tamamlandı

        if (!data.running) {

            clearInterval(timer);

            timer = null;

            document.getElementById(
                "scanButton"
            ).disabled = false;

            document.getElementById(
                "status"
            ).innerText =
                "✅ Tarama tamamlandı — " +
                sonuclar.length +
                " hisse analiz edildi.";

            goster();

        }

    }

    catch (error) {

        document.getElementById(
            "status"
        ).innerText =
            "Sunucu ile bağlantı bekleniyor...";

    }

}


// ========================================================
// FİLTRE
// ========================================================

function filtrele(
    filtre,
    element
) {

    aktifFiltre =
        filtre;

    document
        .querySelectorAll(
            ".filter"
        )
        .forEach(
            x =>
                x.classList.remove(
                    "active"
                )
        );

    element.classList.add(
        "active"
    );

    goster();

}


// ========================================================
// FİLTRE KONTROL
// ========================================================

function filtreUygun(
    hisse
) {

    const sinyal =
        hisse.sinyal || "";

    if (
        aktifFiltre ===
        "TUM"
    ) {

        return true;

    }

    if (
        aktifFiltre ===
        "GUCLU"
    ) {

        return (
            sinyal.includes(
                "GÜÇLÜ AL"
            ) ||
            sinyal.includes(
                "SIKIŞMA ÇÖZÜLÜYOR"
            )
        );

    }

    if (
        aktifFiltre ===
        "AL"
    ) {

        return (
            sinyal.includes(
                "🟢 AL"
            )
        );

    }

    if (
        aktifFiltre ===
        "SIKISMA"
    ) {

        return (
            sinyal.includes(
                "SIKIŞMA"
            )
        );

    }

    if (
        aktifFiltre ===
        "TAKIP"
    ) {

        return (
            sinyal.includes(
                "TAKİBE AL"
            )
        );

    }

    return true;

}


// ========================================================
// SONUÇLARI GÖSTER
// ========================================================

function goster() {

    const area =
        document.getElementById(
            "results"
        );

    const liste =
        sonuclar.filter(
            filtreUygun
        );

    if (!liste.length) {

        area.innerHTML =
            `
            <div class="empty">
                Bu kategoride hisse bulunamadı.
            </div>
            `;

        return;

    }

    area.innerHTML =
        liste.map(
            kartOlustur
        ).join("");

}


// ========================================================
// SİNYAL SINIFI
// ========================================================

function sinyalClass(
    sinyal
) {

    if (
        sinyal.includes(
            "GÜÇLÜ AL"
        ) ||
        sinyal.includes(
            "SIKIŞMA ÇÖZÜLÜYOR"
        )
    ) {

        return "strong";

    }

    if (
        sinyal.includes(
            "🟢 AL"
        )
    ) {

        return "buy";

    }

    if (
        sinyal.includes(
            "TAKİBE"
        )
    ) {

        return "watch";

    }

    if (
        sinyal.includes(
            "SIKIŞMA"
        )
    ) {

        return "squeeze";

    }

    if (
        sinyal.includes(
            "AŞIRI"
        )
    ) {

        return "danger";

    }

    return "wait";

}


// ========================================================
// KART
// ========================================================

function kartOlustur(
    h
) {

    const degisim =
        Number(
            h.gunluk_degisim ||
            0
        );

    const degisimClass =
        degisim >= 0
            ? "positive"
            : "negative";

    return `

        <div
            class="card"
            onclick="detayAc('${h.hisse}')"
        >

            <div class="card-header">

                <div class="symbol">
                    ${h.hisse}
                </div>

                <div class="price">
                    ${h.fiyat} ₺
                </div>

            </div>


            <div
                class="signal
                ${sinyalClass(
                    h.sinyal
                )}"
            >
                ${h.sinyal}
            </div>


            <div class="stats">

                <div class="stat">

                    <div class="stat-title">
                        Teknik Puan
                    </div>

                    <div class="stat-value">
                        ${h.puan}/100
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-title">
                        RSI
                    </div>

                    <div class="stat-value">
                        ${h.rsi}
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-title">
                        Hacim
                    </div>

                    <div class="stat-value">
                        ${h.hacim_orani}x
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-title">
                        Günlük
                    </div>

                    <div
                        class="stat-value
                        ${degisimClass}"
                    >
                        ${degisim.toFixed(2)}%
                    </div>

                </div>

            </div>


            <div class="squeeze-score">

                <div class="score-row">

                    <span>
                        🔒 Sıkışma
                    </span>

                    <b>
                        ${h.sikisma_puani}/100
                    </b>

                </div>


                <div class="score-row">

                    <span>
                        🚀 Patlama
                    </span>

                    <b>
                        ${h.patlama_puani}/100
                    </b>

                </div>

            </div>

        </div>

    `;

}


// ========================================================
// DETAY
// ========================================================

async function detayAc(
    hisse
) {

    const modal =
        document.getElementById(
            "detail"
        );

    const content =
        document.getElementById(
            "detailContent"
        );

    modal.style.display =
        "block";

    content.innerHTML =
        `
        <h2>
            ${hisse}
        </h2>

        <p>
            Detay yükleniyor...
        </p>
        `;

    try {

        const response =
            await fetch(
                "/api/hisse/" +
                hisse
            );

        const data =
            await response.json();

        if (
            !data.basarili
        ) {

            throw new Error(
                data.hata ||
                "Veri alınamadı"
            );

        }

        detayGoster(
            data.hisse
        );

    }

    catch (error) {

        content.innerHTML =
            `
            <h2>${hisse}</h2>

            <p>
                ❌ ${error.message}
            </p>
            `;

    }

}


// ========================================================
// DETAYI GÖSTER
// ========================================================

function detayGoster(
    h
) {

    const content =
        document.getElementById(
            "detailContent"
        );

    let sikisma =
        "";

    if (
        h.sikisma_nedenleri &&
        h.sikisma_nedenleri.length
    ) {

        sikisma =
            `
            <h3>
                🔒 Sıkışma Nedenleri
            </h3>

            <ul>
                ${
                    h.sikisma_nedenleri
                    .map(
                        x =>
                            `<li>${x}</li>`
                    )
                    .join("")
                }
            </ul>
            `;

    }


    let patlama =
        "";

    if (
        h.patlama_nedenleri &&
        h.patlama_nedenleri.length
    ) {

        patlama =
            `
            <h3>
                🚀 Patlama Hazırlığı
            </h3>

            <ul>
                ${
                    h.patlama_nedenleri
                    .map(
                        x =>
                            `<li>${x}</li>`
                    )
                    .join("")
                }
            </ul>
            `;

    }


    let nedenler =
        "";

    if (
        h.nedenler &&
        h.nedenler.length
    ) {

        nedenler =
            `
            <h3>
                📊 Teknik Nedenler
            </h3>

            <ul>
                ${
                    h.nedenler
                    .map(
                        x =>
                            `<li>${x}</li>`
                    )
                    .join("")
                }
            </ul>
            `;

    }


    content.innerHTML = `

        <h2>
            ${h.hisse}
        </h2>

        <div
            class="signal
            ${sinyalClass(
                h.sinyal
            )}"
        >
            ${h.sinyal}
        </div>


        <div class="detail-grid">

            ${detayItem(
                "Fiyat",
                h.fiyat + " ₺"
            )}

            ${detayItem(
                "Teknik Puan",
                h.puan + "/100"
            )}

            ${detayItem(
                "RSI",
                h.rsi
            )}

            ${detayItem(
                "Hacim",
                h.hacim_orani + "x"
            )}

            ${detayItem(
                "Sıkışma",
                h.sikisma_puani +
                "/100"
            )}

            ${detayItem(
                "Patlama",
                h.patlama_puani +
                "/100"
            )}

            ${detayItem(
                "EMA 9",
                h.ema9
            )}

            ${detayItem(
                "EMA 21",
                h.ema21
            )}

            ${detayItem(
                "EMA 50",
                h.ema50
            )}

            ${detayItem(
                "EMA 200",
                h.ema200
            )}

            ${detayItem(
                "Destek",
                h.destek
            )}

            ${detayItem(
                "Direnç",
                h.direnc
            )}

            ${detayItem(
                "52H Zirve",
                h.zirve52
            )}

            ${detayItem(
                "52H Dip",
                h.dip52
            )}

            ${detayItem(
                "Giriş Alt",
                h.giris_alt
            )}

            ${detayItem(
                "Giriş Üst",
                h.giris_ust
            )}

            ${detayItem(
                "Stop",
                h.stop
            )}

            ${detayItem(
                "Hedef 1",
                h.hedef1
            )}

            ${detayItem(
                "Hedef 2",
                h.hedef2
            )}

            ${detayItem(
                "Risk/Getiri",
                h.risk_getiri
            )}

            ${detayItem(
                "Zirveden Uzaklık",
                h.zirveden_uzaklik +
                "%"
            )}

        </div>


        ${sikisma}

        ${patlama}

        ${nedenler}

    `;

}


// ========================================================
// DETAY ITEM
// ========================================================

function detayItem(
    label,
    value
) {

    return `

        <div class="detail-item">

            <div class="detail-label">
                ${label}
            </div>

            <div class="detail-value">
                ${value}
            </div>

        </div>

    `;

}


// ========================================================
// KAPAT
// ========================================================

function kapat() {

    document.getElementById(
        "detail"
    ).style.display =
        "none";

}


// ========================================================
// MODAL DIŞINA TIKLAYINCA KAPAT
// ========================================================

document
    .getElementById(
        "detail"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                kapat();

            }

        }
    );

</script>

</body>
</html>
