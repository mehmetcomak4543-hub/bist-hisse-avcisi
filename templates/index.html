<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BIST Hisse Avcısı</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .aciklama {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 8px;
        }

        button:disabled {
            opacity: 0.5;
        }

        #durum {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        #sonuclar {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(290px, 1fr));
            gap: 15px;
        }

        .kart {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 16px;
        }

        .ust {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hisse {
            font-size: 24px;
            font-weight: bold;
        }

        .fiyat {
            font-size: 20px;
            font-weight: bold;
        }

        .sinyal {
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            margin: 15px 0;
            font-size: 17px;
            font-weight: bold;
        }

        .bilgiler {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .bilgi {
            background: #0f172a;
            border-radius: 8px;
            padding: 9px;
            color: #94a3b8;
            font-size: 12px;
        }

        .bilgi strong {
            display: block;
            color: white;
            font-size: 15px;
            margin-top: 4px;
        }

        .neden {
            margin-top: 14px;
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.6;
        }

        #gecmis {
            display: none;
            margin-top: 20px;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 9px;
            text-align: left;
            border-bottom: 1px solid #334155;
            font-size: 13px;
        }

        .hata {
            color: #f87171;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📈 BIST Hisse Avcısı</h1>

    <div class="aciklama">
        Günlük fiyat + hacim + trend + RSI analiz sistemi
    </div>

    <button id="taraButonu">
        🔎 HİSSELERİ TARA
    </button>

    <button id="gecmisButonu">
        📜 SİNYAL GEÇMİŞİ
    </button>

    <div id="durum">
        Hazır. Hisseleri taramak için butona bas.
    </div>

    <div id="hata" class="hata"></div>

    <div id="sonuclar"></div>

    <div id="gecmis"></div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    console.log("BIST Hisse Avcısı JavaScript çalıştı.");

    const taraButonu =
        document.getElementById("taraButonu");

    const gecmisButonu =
        document.getElementById("gecmisButonu");

    const durum =
        document.getElementById("durum");

    const sonuclar =
        document.getElementById("sonuclar");

    const hata =
        document.getElementById("hata");

    const gecmis =
        document.getElementById("gecmis");


    /*
     * HİSSE TARAMA
     */

    taraButonu.addEventListener("click", async function () {

        console.log("Tarama butonuna basıldı.");

        taraButonu.disabled = true;

        durum.innerText =
            "⏳ Hisseler taranıyor...";

        hata.innerText = "";

        sonuclar.innerHTML =
            "<div>Veriler alınıyor, lütfen bekleyin...</div>";

        try {

            const cevap =
                await fetch("/api/scan", {
                    method: "GET",
                    cache: "no-store"
                });


            console.log(
                "Sunucu cevabı:",
                cevap.status
            );


            if (!cevap.ok) {

                throw new Error(
                    "Sunucu HTTP " +
                    cevap.status +
                    " hatası verdi."
                );
            }


            const veri =
                await cevap.json();


            console.log(
                "Tarama sonucu:",
                veri
            );


            durum.innerText =
                "✅ Tarama tamamlandı — " +
                veri.sonuc_sayisi +
                " hisse bulundu.";


            if (
                !veri.sonuclar ||
                veri.sonuclar.length === 0
            ) {

                sonuclar.innerHTML =
                    "<div>⚠️ Hisse bulunamadı.</div>";

            } else {

                sonuclar.innerHTML =
                    veri.sonuclar.map(
                        function (hisse) {

                            let nedenler =
                                "Belirgin teyit yok.";

                            if (
                                hisse.nedenler &&
                                hisse.nedenler.length > 0
                            ) {

                                nedenler =
                                    hisse.nedenler
                                    .map(
                                        function (neden) {
                                            return "• " + neden;
                                        }
                                    )
                                    .join("<br>");

                            }


                            return `

                            <div class="kart">

                                <div class="ust">

                                    <div class="hisse">
                                        ${hisse.hisse}
                                    </div>

                                    <div class="fiyat">
                                        ${Number(hisse.fiyat).toFixed(2)} ₺
                                    </div>

                                </div>


                                <div class="sinyal">

                                    ${hisse.sinyal}

                                </div>


                                <div class="bilgiler">

                                    <div class="bilgi">
                                        RSI
                                        <strong>
                                            ${hisse.rsi}
                                        </strong>
                                    </div>

                                    <div class="bilgi">
                                        Hacim
                                        <strong>
                                            ${hisse.hacim_orani}x
                                        </strong>
                                    </div>

                                    <div class="bilgi">
                                        Günlük
                                        <strong>
                                            ${hisse.gunluk_degisim}%
                                        </strong>
                                    </div>

                                    <div class="bilgi">
                                        Zirveden
                                        <strong>
                                            ${hisse.zirveden_uzaklik}%
                                        </strong>
                                    </div>

                                    <div class="bilgi">
                                        EMA 9
                                        <strong>
                                            ${hisse.ema9}
                                        </strong>
                                    </div>

                                    <div class="bilgi">
                                        EMA 21
                                        <strong>
                                            ${hisse.ema21}
                                        </strong>
                                    </div>

                                    <div class="bilgi">
                                        EMA 50
                                        <strong>
                                            ${hisse.ema50}
                                        </strong>
                                    </div>

                                    <div class="bilgi">
                                        EMA 200
                                        <strong>
                                            ${hisse.ema200}
                                        </strong>
                                    </div>

                                </div>


                                <div class="neden">

                                    <strong>Neden?</strong>

                                    <br>

                                    ${nedenler}

                                </div>

                            </div>

                            `;

                        }
                    ).join("");

            }


            if (
                veri.hatalar &&
                veri.hatalar.length > 0
            ) {

                hata.innerText =
                    "⚠️ " +
                    veri.hatalar.length +
                    " hisseden veri alınamadı.";

            }

        }

        catch (err) {

            console.error(
                "Tarama hatası:",
                err
            );

            durum.innerText =
                "❌ Tarama sırasında hata oluştu.";

            hata.innerText =
                err.message;

            sonuclar.innerHTML = "";

        }

        finally {

            taraButonu.disabled = false;

        }

    });


    /*
     * SİNYAL GEÇMİŞİ
     */

    gecmisButonu.addEventListener(
        "click",
        async function () {

            gecmis.style.display = "block";

            gecmis.innerHTML =
                "⏳ Geçmiş yükleniyor...";


            try {

                const cevap =
                    await fetch(
                        "/api/history",
                        {
                            cache: "no-store"
                        }
                    );


                if (!cevap.ok) {

                    throw new Error(
                        "Geçmiş alınamadı."
                    );

                }


                const veriler =
                    await cevap.json();


                if (
                    !veriler ||
                    veriler.length === 0
                ) {

                    gecmis.innerHTML =
                        "<h3>📜 Sinyal Geçmişi</h3>" +
                        "<p>Henüz kayıt yok.</p>";

                    return;

                }


                let tablo = `

                    <h3>
                        📜 Sinyal Geçmişi
                    </h3>

                    <table>

                        <tr>
                            <th>Tarih</th>
                            <th>Hisse</th>
                            <th>Sinyal</th>
                            <th>Fiyat</th>
                        </tr>

                `;


                veriler
                .slice()
                .reverse()
                .forEach(
                    function (kayit) {

                        tablo += `

                            <tr>

                                <td>
                                    ${kayit.tarih}
                                </td>

                                <td>
                                    <strong>
                                        ${kayit.hisse}
                                    </strong>
                                </td>

                                <td>
                                    ${kayit.sinyal}
                                </td>

                                <td>
                                    ${kayit.fiyat} ₺
                                </td>

                            </tr>

                        `;

                    }
                );


                tablo += "</table>";

                gecmis.innerHTML = tablo;

            }

            catch (err) {

                gecmis.innerHTML =
                    "❌ " +
                    err.message;

            }

        }
    );

});

</script>

</body>
</html>
