<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BIST Hisse Avcısı V4</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #94a3b8;
    margin-bottom: 20px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 20px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

button:disabled {
    opacity: 0.5;
}

.status {
    margin: 15px 0;
    padding: 12px;
    background: #1e293b;
    border-radius: 10px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 15px;
}

.card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 18px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.symbol {
    font-size: 24px;
    font-weight: bold;
}

.price {
    font-size: 24px;
    font-weight: bold;
}

.score {
    font-size: 36px;
    font-weight: bold;
    margin: 15px 0;
}

.positive {
    color: #22c55e;
}

.negative {
    color: #ef4444;
}

.signal {
    display: inline-block;
    background: #334155;
    padding: 7px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
}

.metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.metric {
    background: #0f172a;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
}

.metric b {
    display: block;
    margin-top: 4px;
    font-size: 15px;
}

.signals {
    margin-top: 12px;
    color: #94a3b8;
    font-size: 13px;
}

.error {
    color: #f87171;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>📈 BIST Hisse Avcısı V4</h1>

<div class="subtitle">
Günlük teknik analiz ve hacim tarama sistemi
</div>

<button id="scanBtn" onclick="scan()">
🔎 Hisseleri Tara
</button>

<div id="status" class="status">
Hazır. Tarama başlatmak için butona bas.
</div>

<div id="results" class="cards"></div>

<div id="errors" class="error"></div>

</div>


<script>

async function scan() {

    const btn = document.getElementById("scanBtn");
    const status = document.getElementById("status");
    const results = document.getElementById("results");
    const errors = document.getElementById("errors");

    btn.disabled = true;

    status.innerText = "⏳ BIST hisseleri taranıyor...";

    results.innerHTML =
        "<div>Veriler alınıyor, lütfen bekleyin...</div>";

    errors.innerHTML = "";

    try {

        const response = await fetch("/api/scan");

        if (!response.ok) {
            throw new Error("Sunucu HTTP hatası: " + response.status);
        }

        const data = await response.json();

        console.log(data);

        status.innerText =
            "✅ Tarama tamamlandı. " +
            data.sonuc_sayisi +
            " hisse bulundu.";

        if (
            !data.sonuclar ||
            data.sonuclar.length === 0
        ) {

            results.innerHTML =
                "<div>⚠️ Veri bulunamadı.</div>";

            if (data.hatalar && data.hatalar.length > 0) {

                errors.innerHTML =
                    "<br><b>Veri alınamayan hisseler:</b><br>" +
                    data.hatalar.map(x =>
                        x.hisse + ": " + x.hata
                    ).join("<br>");
            }

            return;
        }


        results.innerHTML =
            data.sonuclar.map(stock => {

                const degisim =
                    Number(stock.gunluk_degisim);

                const degisimClass =
                    degisim >= 0
                    ? "positive"
                    : "negative";

                let durum = "İZLE";

                if (stock.puan >= 75) {
                    durum = "🔥 GÜÇLÜ SİNYAL";
                }
                else if (stock.puan >= 60) {
                    durum = "🟢 AL ADAYI";
                }
                else if (stock.puan >= 45) {
                    durum = "🟡 İZLE";
                }
                else {
                    durum = "⚪ ZAYIF";
                }


                return `

                <div class="card">

                    <div class="header">

                        <div>
                            <div class="symbol">
                                ${stock.hisse}
                            </div>

                            <div class="signal">
                                ${durum}
                            </div>
                        </div>

                        <div class="price">
                            ${stock.fiyat.toFixed(2)} ₺
                        </div>

                    </div>


                    <div class="score">
                        ${stock.puan}/100
                    </div>


                    <div class="${degisimClass}">
                        Günlük:
                        ${degisim >= 0 ? "▲" : "▼"}
                        ${Math.abs(degisim).toFixed(2)}%
                    </div>


                    <div class="metrics">

                        <div class="metric">
                            RSI
                            <b>${stock.rsi}</b>
                        </div>

                        <div class="metric">
                            Hacim
                            <b>${stock.hacim_orani}x</b>
                        </div>

                        <div class="metric">
                            EMA 9
                            <b>${stock.ema9}</b>
                        </div>

                        <div class="metric">
                            EMA 21
                            <b>${stock.ema21}</b>
                        </div>

                        <div class="metric">
                            EMA 50
                            <b>${stock.ema50}</b>
                        </div>

                        <div class="metric">
                            EMA 200
                            <b>${stock.ema200}</b>
                        </div>

                        <div class="metric">
                            20G Direnç
                            <b>${stock.direnc20}</b>
                        </div>

                    </div>


                    <div class="signals">

                        <b>Sinyaller:</b><br>

                        ${
                            stock.sinyaller &&
                            stock.sinyaller.length
                            ? stock.sinyaller.join(" • ")
                            : "Belirgin sinyal yok"
                        }

                    </div>

                </div>

                `;

            }).join("");


        if (
            data.hatalar &&
            data.hatalar.length > 0
        ) {

            errors.innerHTML =
                "<br>⚠️ " +
                data.hatalar.length +
                " hisseden veri alınamadı.";

        }

    }

    catch (error) {

        status.innerText =
            "❌ Tarama sırasında hata oluştu.";

        results.innerHTML =
            "<div>" +
            error.message +
            "</div>";

    }

    finally {

        btn.disabled = false;

    }

}

</script>

</body>
</html>
