
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIST Hisse Avcısı V7</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#080d1b;--card:#11192b;--card2:#16213b;--text:#eef3ff;--muted:#8490a8;--green:#22c55e;--red:#ef4444;--blue:#2f6df6;--purple:#5540c9;--border:#202b40}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}
h1{margin:0;font-size:25px}.sub{color:var(--muted);margin-top:5px}.btn{border:0;border-radius:13px;padding:13px 18px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px}
.title{font-size:18px;font-weight:800;margin-bottom:12px}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 8px;border-bottom:1px solid #1d2739;cursor:pointer}.row:last-child{border:0}.sym{font-weight:800}.pos{color:var(--green);font-weight:800}.neg{color:var(--red);font-weight:800}
.section{margin-top:18px}.section h2{font-size:19px;margin:0 0 10px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stock{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:17px;cursor:pointer}.stock:hover{border-color:#3c5da8}.price{font-size:23px;font-weight:800}.badge{display:inline-block;padding:8px 10px;border-radius:10px;background:#124e2b;color:#8af0ae;font-weight:800;font-size:13px;margin:9px 0}.badge.p{background:#30257d;color:#cfc8ff}.score{font-size:31px;font-weight:900}.muted{color:var(--muted)}.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.mini div{background:#0d1526;padding:10px;border-radius:11px}.mini b{display:block;margin-top:4px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:5;padding:12px;overflow:auto}.modalbox{max-width:1000px;margin:20px auto;background:#0e1728;border:1px solid #263653;border-radius:20px;padding:18px}.close{float:right;background:#26324a;color:#fff;border:0;border-radius:10px;padding:9px 12px;cursor:pointer}.detailhead{display:flex;justify-content:space-between;gap:15px;align-items:center}.chart{height:430px;margin-top:15px;background:#0a1120;border-radius:15px;overflow:hidden}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:12px}.level{background:var(--card);padding:11px;border-radius:11px}.level b{display:block;margin-top:4px}.reasons{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}.reason{background:#172441;padding:8px 10px;border-radius:9px;color:#bdd0f6}.tv{background:#8b5cf6}.loading{padding:30px;text-align:center;color:var(--muted)}@media(max-width:760px){.grid2,.cards{grid-template-columns:1fr}.levels{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.chart{height:330px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>🚀 BIST Hisse Avcısı V7</h1><div class="sub">500 hisseyi tara → 9 güçlü adayı göster</div></div>
    <button class="btn" onclick="scan()">🔎 BIST 500 TARA</button>
  </div>

  <div id="status" class="card" style="margin-top:15px">Hazır. Tarama başlatmak için butona bas.</div>

  <div class="grid2">
    <div class="card"><div class="title">🔥 En çok yükselen 10</div><div id="gainers"><div class="loading">Henüz tarama yapılmadı.</div></div></div>
    <div class="card"><div class="title">🔻 En çok düşen 10</div><div id="losers"><div class="loading">Henüz tarama yapılmadı.</div></div></div>
  </div>

  <div class="section"><h2>🔥 GÜÇLÜ AL — 3 hisse</h2><div class="cards" id="strong"></div></div>
  <div class="section"><h2>🟢 AL — 3 hisse</h2><div class="cards" id="buy"></div></div>
  <div class="section"><h2>🔒 SIKIŞMA / KIRILIM — 3 hisse</h2><div class="cards" id="squeeze"></div></div>
</div>

<div class="modal" id="modal">
 <div class="modalbox">
  <button class="close" onclick="closeModal()">✕</button>
  <div id="detail"></div>
 </div>
</div>

<script>
let chart, candleSeries, volumeSeries;

function money(x){return Number(x).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺'}
function pct(x){return (x>=0?'+':'')+Number(x).toFixed(2)+'%'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function row(x){
 return `<div class="row" onclick="openStock('${x.symbol}')"><span class="sym">${x.symbol}</span><span>${money(x.price)}</span><span class="${x.daily>=0?'pos':'neg'}">${pct(x.daily)}</span></div>`;
}
function stockCard(x){
 return `<div class="stock" onclick="openStock('${x.symbol}')">
   <div class="top"><div><div class="sym" style="font-size:22px">${x.symbol}</div><div class="muted">${money(x.price)}</div></div><div class="score">${x.score}</div></div>
   <div class="badge ${x.category.includes('SIKIŞ')||x.category.includes('KIRIL')?'p':''}">${esc(x.category)}</div>
   <div class="mini">
    <div><span class="muted">RSI</span><b>${x.rsi}</b></div>
    <div><span class="muted">Hacim</span><b>${x.volume_ratio}x</b></div>
    <div><span class="muted">Sıkışma</span><b>${x.squeeze}/100</b></div>
    <div><span class="muted">Kırılım</span><b>${x.breakout}/100</b></div>
   </div>
 </div>`;
}
function renderHome(d){
 document.getElementById('gainers').innerHTML=d.gainers.map(row).join('');
 document.getElementById('losers').innerHTML=d.losers.map(row).join('');
 document.getElementById('strong').innerHTML=d.strong.map(stockCard).join('');
 document.getElementById('buy').innerHTML=d.buy.map(stockCard).join('');
 document.getElementById('squeeze').innerHTML=d.squeeze.map(stockCard).join('');
 document.getElementById('status').innerHTML=`✅ ${d.scanned} hisse analiz edildi. Son tarama: <b>${d.updated||'-'}</b>`;
}
async function loadHome(){let r=await fetch('/api/home');renderHome(await r.json())}
async function scan(){
 document.getElementById('status').innerHTML='⏳ BIST hisseleri taranıyor...';
 await fetch('/api/scan',{method:'POST'});
 const t=setInterval(async()=>{
   let s=await (await fetch('/api/status')).json();
   document.getElementById('status').innerHTML=`⏳ Tarama: ${s.progress}/${s.total} — ${s.running?'devam ediyor...':'tamamlandı'}`;
   if(!s.running){clearInterval(t);if(s.error)document.getElementById('status').innerHTML='❌ '+esc(s.error);else loadHome();}
 },1000);
}
async function openStock(symbol){
 document.getElementById('modal').style.display='block';
 document.getElementById('detail').innerHTML='<div class="loading">📊 Grafik ve analiz hazırlanıyor...</div>';
 let d=await (await fetch('/api/stock/'+symbol)).json();
 if(d.error){document.getElementById('detail').innerHTML='❌ '+esc(d.error);return}
 let a=d.analysis;
 document.getElementById('detail').innerHTML=`
  <div class="detailhead">
   <div><div class="muted">Hisse analizi</div><h2 style="margin:4px 0">${a.symbol} — ${money(a.price)}</h2><div class="badge">${esc(a.category)}</div></div>
   <div style="text-align:right"><div class="muted">Güven skoru</div><div class="score">${a.score}/100</div>
   <button class="btn tv" onclick="window.open('https://www.tradingview.com/chart/?symbol=BIST:${a.symbol}','_blank')">📈 TradingView'de Aç</button></div>
  </div>
  <div id="chart" class="chart"></div>
  <div class="levels">
   <div class="level"><span class="muted">Alım alt</span><b>${money(a.entry_low)}</b></div>
   <div class="level"><span class="muted">Alım üst</span><b>${money(a.entry_high)}</b></div>
   <div class="level"><span class="muted">Hedef 1</span><b>${money(a.target1)}</b></div>
   <div class="level"><span class="muted">Hedef 2</span><b>${money(a.target2)}</b></div>
   <div class="level"><span class="muted">Stop</span><b>${money(a.stop)}</b></div>
  </div>
  <div class="mini">
   <div><span class="muted">Teknik</span><b>${a.technical}/100</b></div>
   <div><span class="muted">RSI</span><b>${a.rsi}</b></div>
   <div><span class="muted">Hacim</span><b>${a.volume_ratio}x</b></div>
   <div><span class="muted">Sıkışma</span><b>${a.squeeze}/100</b></div>
   <div><span class="muted">Kırılım</span><b>${a.breakout}/100</b></div>
   <div><span class="muted">Zirveden uzaklık</span><b>${a.from_peak}%</b></div>
  </div>
  <div class="reasons">${a.reasons.map(r=>`<span class="reason">✅ ${esc(r)}</span>`).join('')}</div>
  <div class="card" style="margin-top:15px"><b>🤖 Programın yorumu</b><p class="muted">Bu hisse 500 hisselik taramada teknik puan, trend, hacim, sıkışma ve kırılım hazırlığı birlikte değerlendirilerek öne çıktı. Bu bir garanti değil; karar desteği olarak kullanılmalıdır.</p></div>`;
 setTimeout(()=>drawChart(d.candles),50);
}
function drawChart(candles){
 const el=document.getElementById('chart'); if(chart) chart.remove();
 chart=LightweightCharts.createChart(el,{layout:{background:{color:'#0a1120'},textColor:'#9aa8c2'},grid:{vertLines:{color:'#182338'},horzLines:{color:'#182338'}},rightPriceScale:{borderColor:'#273650'},timeScale:{borderColor:'#273650'}});
 candleSeries=chart.addCandlestickSeries({upColor:'#22c55e',downColor:'#ef4444',borderVisible:false,wickUpColor:'#22c55e',wickDownColor:'#ef4444'});
 candleSeries.setData(candles.map(x=>({time:x.time,open:x.open,high:x.high,low:x.low,close:x.close})));
 chart.timeScale().fitContent();
}
function closeModal(){document.getElementById('modal').style.display='none'}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
loadHome();
</script>
</body>
</html>
